openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for a given name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a JSON greeting for the given name, or a default greeting
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
  /farewell:
    get:
      operationId: getFarewell
      summary: Return a JSON goodbye message for the given name, or a default goodbye
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to bid farewell to
      responses:
        '200':
          description: The farewell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The greeting or farewell text
